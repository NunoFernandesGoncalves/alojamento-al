<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alojamento</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">

            <div class="property">
                Apartamento Sol
            </div>

            <h1>
                Bem-vindo
                <span id="guestName">Hóspede</span>
            </h1>

            <div class="details">
                <div>
                    Check-out:
                    <span id="checkout">--</span>
                </div>

                <div>
                    Wi-Fi:
                    <span id="wifi">--</span>
                </div>
            </div>

        </div>

        <div class="grid">

            <div class="card">
                ⎯ TV
            </div>

            <div class="card">
                ⎯ Netflix
            </div>

            <div class="card">
                ⎯ Guia da Casa
            </div>

            <div class="card">
                ⎯ Restaurantes
            </div>

            <div class="card">
                ⎯ Ar Condicionado
            </div>

            <div class="card">
                ⎯ Contacto
            </div>

        </div>

        <div class="footer">
            Desejamos uma excelente estadia.
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
