<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bem-vindo</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.container {
    padding: 40px;
}

h1 {
    font-size: 48px;
    margin-bottom: 10px;
}

.info {
    font-size: 22px;
    margin-bottom: 30px;
    color: #cbd5e1;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: #1e293b;
    border-radius: 15px;
    padding: 30px;
    text-align: center;
    font-size: 24px;
    cursor: pointer;
}

.card:hover {
    background: #334155;
}
</style>

</head>
<body>

<div class="container">

<h1>Bem-vindo Nuno</h1>

<div class="info">
Check-out: 25 Outubro às 11h<br>
Wi-Fi: ApartamentoSol_5G
</div>

<div class="grid">

<div class="card">
📺 TV
</div>

<div class="card">
🍿 Netflix
</div>

<div class="card">
📖 Guia da Casa
</div>

<div class="card">
❄️ Ar Condicionado
</div>

<div class="card">
🍴 Restaurantes
</div>

<div class="card">
📞 Contacto
</div>

</div>

</div>

</body>
</html>
